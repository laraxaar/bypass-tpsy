[tunnel]
adapter_name = BypassTUN
adapter_ip = 10.127.0.1
adapter_mask = 255.255.255.0
session_capacity = 4194304

[routes]
; Blocked subnets (CIDR format, parsed on startup)
subnets = 104.244.42.0/24, 149.154.160.0/20
; Target blocked hosts (dynamic hostname routes resolved via DoH)
hosts = rutracker.org, linkedin.com, t.co

[dns]
enabled = true
; DoH secure upstream provider (RFC 8484 format)
upstream = https://cloudflare-dns.com/dns-query
; DNS refresh cache timeout (seconds)
refresh_interval = 300

[quic]
; Block UDP port 443 packets to force browsers to fallback to standard TCP bypass
block_quic = true

[inject]
; Index of the real internet-facing NIC gateway.
; Set to 0 to automatically detect the interface using route lookup to 8.8.8.8.
real_interface_index = 0

[desync]
; Evasion strategy mode: split | junk | http | chain
mode = chain
; Split strategy settings:
; Byte offset to split ClientHello (0 = auto-calculate split inside SNI string)
split_offset = 0
; Delay between the first and second split TCP segment (milliseconds)
split_delay_ms = 50
; Junk injection settings:
; Size of fake payload to generate (bytes)
junk_size = 32
; TTL of the fake payload (1 = dies at RKN/TSPU DPI box, does not reach target server)
junk_ttl = 1
; Sequence offset of the fake TCP payload (negative value to reside outside receiver window)
junk_seq_offset = -1
; Chain strategy order list (applies desync.junk, then desync.split)
chain_order = junk,split

[host_filter]
; Evasion filtering mode: whitelist (only bypass listed) | blacklist (bypass all except listed)
mode = whitelist
patterns = *.rutracker.org, rutracker.org, linkedin.com, *.linkedin.com, t.co, *.t.co

[route_refresh]
enabled = true
; Period to re-query DNS to catch IP address rotation (minutes)
interval_min = 5
; Period to wait before applying a route update after DNS change (seconds, mitigates DNS round-robin flapping)
stabilize_seconds = 30

[stats]
; Metrics report print interval in logging output (seconds, 0 = disabled)
interval_sec = 30

[logging]
; Log level verbosity: debug | info | warn | error
level = info
; Path to file for writing logs. Leave empty to write to stderr/console only.
file =
